name: Desktop installers (Tauri)

# Spec §13 "Double-click installer mandate": per-platform native installers
# (.msi/.exe, .dmg, .AppImage/.deb) that bundle the PyInstaller-frozen
# prism-gui sidecar (embedded CPython). Triggered by pushing a v* tag — runs
# alongside Release.yml, which builds the CLI binaries + wheel.
#
# Manual dispatch is also allowed for pre-tag testing:  gh workflow run desktop.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_os: windows
            arch: x86_64
          - os: ubuntu-22.04
            artifact_os: linux
            arch: x86_64
          - os: macos-latest
            artifact_os: macos
            arch: arm64
          - os: macos-13        # Intel macOS runner (x86_64-apple-darwin)
            artifact_os: macos
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps for Tauri (webkit2gtk etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Python build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI binary + Tauri installers
        shell: bash
        run: bash packaging/build_tauri.sh

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p out
          BUNDLE=packaging/tauri/prism-gui/src-tauri/target/release/bundle
          find "$BUNDLE" -type f \( -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: SHA256SUMS
        shell: bash
        working-directory: out
        run: |
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS
          else shasum -a 256 * > SHA256SUMS; fi

      - uses: actions/upload-artifact@v4
        with:
          name: prism-desktop-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: out/*

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'prism-desktop-*'
          merge-multiple: true

      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.msi
            *.exe
            *.dmg
            *.AppImage
            *.deb
            SHA256SUMS
          append_body: true
