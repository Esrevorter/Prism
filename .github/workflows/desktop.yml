name: Desktop installers (Tauri)

# Spec §13 "Double-click installer mandate": per-platform native installers
# (.msi/.exe, .dmg, .AppImage/.deb) that bundle the PyInstaller-frozen
# prism-gui sidecar (embedded CPython). Triggered by pushing a v* tag — runs
# alongside Release.yml, which builds the CLI binaries + wheel.
#
# Manual dispatch is also allowed for pre-tag testing:  gh workflow run desktop.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # OIDC identity for sigstore/cosign keyless signing (free provenance) and
  # for Azure Trusted Signing federation (docs/ATTESTATION.md §2/§4).
  id-token: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # One runner per installer we ship. macos-latest (arm64) produces the
        # universal2 .dmg that also runs on Intel Macs, so no separate macos-13
        # job is needed — that runner was retired by GitHub anyway and only
        # produced queue delays / capacity notices.
        include:
          - os: windows-latest
            artifact_os: windows
            arch: x86_64
          - os: ubuntu-22.04     # pinned: libwebkit2gtk-4.0-dev baseline for Tauri v2
            artifact_os: linux
            arch: x86_64
          - os: macos-latest
            artifact_os: macos
            arch: universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          # Node 20 is EOL (April 2026) — setup-node warns and needs Node >= 24.
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps for Tauri (webkit2gtk etc.)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Python build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI binary + Tauri installers
        shell: bash
        run: bash packaging/build_tauri.sh

      # ---- Attestation (docs/ATTESTATION.md) ---------------------------------
      # Windows: Authenticode-sign the sidecar exe BEFORE bundling and let the
      # NSIS/Tauri bundle step inherit it; sign final .msi/.exe after.
      # Runs only when a cert is configured — unsigned builds keep working.
      - name: Windows code signing (Authenticode)
        if: matrix.os == 'windows-latest' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_CERT_SUBJECT: ${{ vars.WINDOWS_CERT_SUBJECT || 'Prism Wallet' }}
        run: |
          [IO.File]::WriteAllBytes("$env:TEMP\prism.pfx",
            [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                       -Recurse -Filter signtool.exe | Select -Last 1).FullName
          $targets = Get-ChildItem -Recurse -Include *.exe,*.msi `
                      -Path packaging\tauri\prism-gui\src-tauri\target\release\bundle,`
                              dist
          foreach ($f in $targets) {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f "$env:TEMP\prism.pfx" /p $env:WINDOWS_PFX_PASSWORD /n $env:WINDOWS_CERT_SUBJECT $f.FullName
            & $signtool verify /pa $f.FullName
          }

      # macOS: Developer ID codesign (hardened runtime) + notarization + staple.
      # Gated on Apple credentials; skipped loudly otherwise (never silently).
      - name: macOS codesign + notarize + staple
        if: matrix.os == 'macos-latest' && env.APPLE_ID != ''
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPER_CERT_B64: ${{ secrets.APPLE_DEVELOPER_CERT_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE=packaging/tauri/prism-gui/src-tauri/target/release/bundle
          security create-keychain -b ci.keychain-db
          security default-keychain -s ci.keychain-db
          security unlock-keychain -p "" ci.keychain-db
          # Optional: import a Developer ID p12 (base64 secret) if provided;
          # otherwise assume the runner keychain already holds "Developer ID Application".
          if [ -n "${APPLE_DEVELOPER_CERT_B64:-}" ]; then
            echo "$APPLE_DEVELOPER_CERT_B64" | base64 -D > ci.p12
            security import ci.p12 -k ci.keychain-db -T /usr/bin/codesign \
              -P "${APPLE_CERT_PASSWORD:-}" || exit 1
            rm -f ci.p12
          fi
          for APP in $(find "$BUNDLE/macos" -name '*.app' -maxdepth 1); do
            # Sign inner binaries first (sidecar!), then the bundle.
            find "$APP/Contents" -type f \( -perm +111 -o -name '*.dylib' \) \
              -exec codesign --force --timestamp --options runtime \
                   --sign "Developer ID Application" {} \; || true
            codesign --force --deep --timestamp --options runtime \
              --sign "Developer ID Application" "$APP"
          done
          for DMG in "$BUNDLE"/dmg/*.dmg; do
            codesign --force --timestamp --sign "Developer ID Application" "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASS" --wait
            xcrun stapler staple "$DMG"
          done
          spctl -a -vv "$BUNDLE"/dmg/*.dmg || true   # advisory; dmg gate is on open

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p out
          BUNDLE=packaging/tauri/prism-gui/src-tauri/target/release/bundle
          find "$BUNDLE" -type f \( -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: SHA256SUMS
        shell: bash
        working-directory: out
        run: |
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS
          else shasum -a 256 * > SHA256SUMS; fi

      - uses: actions/upload-artifact@v4
        with:
          name: prism-desktop-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: out/*

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write   # sigstore/cosign keyless (docs/ATTESTATION.md §4)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'prism-desktop-*'
          merge-multiple: true

      # Free, cross-platform provenance: keyless cosign signatures bound to
      # this repo's OIDC identity + Rekor transparency log entries. Users can
      # verify every installer without trusting GitHub alone. Skips gracefully
      # if the sigstore network is unavailable — never blocks a release.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign all assets (cosign keyless)
        shell: bash
        run: |
          set -uo pipefail
          ok=0; fail=0
          for f in *.msi *.exe *.dmg *.AppImage *.deb; do
            [ -e "$f" ] || continue
            if cosign sign-blob --yes \
                 --output-signature "$f.sig" \
                 --output-certificate "$f.crt" \
                 "$f"; then
              ok=$((ok+1))
            else
              echo "::warning::cosign failed for $f (sigstore outage?) — shipping unsigned"
              rm -f "$f.sig" "$f.crt"; fail=$((fail+1))
            fi
          done
          echo "cosigned=$ok failed=$fail" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach installers to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.msi
            *.exe
            *.dmg
            *.AppImage
            *.deb
            *.sig
            *.crt
            SHA256SUMS
          append_body: true
