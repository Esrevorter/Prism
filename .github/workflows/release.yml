name: Release

# Triggered by pushing a tag like v0.1.0:  git tag -a v0.1.0 -m "..." && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_os: windows
            arch: x86_64
          - os: ubuntu-22.04
            artifact_os: linux
            arch: x86_64
          - os: macos-latest
            artifact_os: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyInstaller cannot cross-compile: each binary is built on its own OS runner.
      - name: Install build tools & run tests
        run: |
          python -m pip install --upgrade pip pytest pyinstaller
          pytest prism/tests -q

      # sanity check the wheel + `prism` console script too
      - name: Build sdist/wheel
        run: |
          python -m pip install build
          python -m build

      - name: Build artifact
        shell: bash
        run: bash packaging/build_release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: prism-${{ matrix.artifact_os }}-${{ matrix.arch }}
          path: |
            prism-*-*.zip
            dist/*.whl
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'prism-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prism-*.zip
            *.whl
            *.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: true   # Phase-1 reference implementation — flip to false at mainnet candidate
