name: CI

# Branch/PR validation for every push — the release.yml test job only runs on
# v* tags, so without this workflow a broken merge could reach main unnoticed.
# Runs the exact suite command from spec §13 acceptance evidence (511 passed /
# 7 skipped baseline) plus a byte-compile sanity pass over the whole package.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile all sources (catches syntax drift cheaply)
        run: python -m compileall -q prism packaging/sync_gui.py

      # Full suite incl. the lean-auth RPC/GUI tests and the testnet-parity
      # soak (P5/P6). Runtime ~2 min on runners; no network required.
      - name: Run test suite
        run: pytest prism/tests -q

      # v0.1.7 post-mortem gate: fails loudly on committed build artifacts,
      # version drift between release locations, or captcha wire-contract
      # regressions (missing `tiles` / leaked answer key `target`).
      - name: Release gate (artifacts / versions / captcha contract)
        run: python scripts/release_gate.py

  installer-dryrun:
    # Validates the desktop pipeline as far as possible WITHOUT a tag:
    # GUI bundle sync + PyInstaller freeze of both binaries. The Tauri bundling
    # step itself stays tag-gated in desktop.yml (it needs npm/rust/webkit).
    name: Installer dry-run (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Sync GUI static bundle
        run: python packaging/sync_gui.py
      - name: Freeze CLI binary
        run: pyinstaller packaging/prism.spec --distpath dist --workpath build -y
      - name: Freeze GUI launcher binary
        run: pyinstaller packaging/prism_gui.spec --distpath dist --workpath build -y
      - name: Smoke-test frozen CLI binary
        run: |
          ./dist/prism --help >/dev/null
          ./dist/prism chain --network refraction >/dev/null || \
          ./dist/prism --json-status || true
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-dryrun
          path: dist/prism*
