[package]
name = "prism-gui-shell"
version = "0.1.13"
description = "Tauri installer shell for the Prism desktop wallet. Bundles the PyInstaller-frozen `prism-gui` sidecar (embedded CPython) so end users never see a terminal (spec §13 double-click installer mandate)."
authors = ["Project Prism contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
url = "2"
tauri = { version = "1.6", features = ["shell-sidecar"] }

[features]
# used by tauri.conf.json build config on release builds — do not remove
custom-protocol = ["tauri/custom-protocol"]
